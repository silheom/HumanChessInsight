name: Deploy Human Chess Insight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/stockfish

          cp index.html dist/
          cp style.css dist/
          cp app.js dist/
          cp README.md dist/
          cp THIRD-PARTY-NOTICES.txt dist/
          cp LICENSE-STOCKFISH.txt dist/

          curl -fL --retry 3 \
            "https://github.com/nmrugg/stockfish.js/releases/download/v19.0.0/stockfish-19-lite-single.js" \
            -o dist/stockfish/stockfish-19-lite-single.js

          curl -fL --retry 3 \
            "https://github.com/nmrugg/stockfish.js/releases/download/v19.0.0/stockfish-19-lite-single.wasm" \
            -o dist/stockfish/stockfish-19-lite-single.wasm

          test -s dist/stockfish/stockfish-19-lite-single.js
          test -s dist/stockfish/stockfish-19-lite-single.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
